<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Viewer Test</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #414141;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .model-container {
            height: 700px;
            width: 700px;
        }

        model-viewer {
            height: 100%;
            width: 100%;
        }
    </style>
</head>

<body>
    <div class="model-container">
        <model-viewer alt="3d model" src="Asset\Jeep_Renegade_2016_obj\Jeep_Renegade_2016.glb"
        autoplay
        camera-controls
        touch-action="pan-y"
        camera-orbit="30deg 75deg 105%"
        min-camera-orbit="auto 75deg auto"
        max-camera-orbit="auto 75deg auto">

        </model-viewer>
    </div>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"></script>
</body>

</html>
